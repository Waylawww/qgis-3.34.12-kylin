name: osg2vsg 0.4.0 · Native Kylin V10 x86_64 build/install/test

on:
  push:
    branches: [feat/osg2vsg-kylin-native]
    paths:
      - '.github/workflows/osg2vsg-native.yml'
      - 'config/osg2vsg.env'
      - 'scripts/osg2vsg-*.sh'
  workflow_dispatch:
    inputs:
      stage:
        description: 'preflight / source / build / install / all'
        type: choice
        options: [preflight, source, build, install, all]
        default: all
      build_jobs:
        description: '并行编译任务数'
        default: '4'

permissions:
  contents: read

concurrency:
  group: osg2vsg-native-kylin-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event.inputs.stage || 'all' }}
  OSG2VSG_BUILD_JOBS: ${{ github.event.inputs.build_jobs || '4' }}

jobs:
  native-build:
    name: Native osg2vsg build on kylin-v10-hygon
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: [self-hosted, Linux, X64, kylin-v10-hygon, qgis-build]
    timeout-minutes: 360
    steps:
      - name: Runner identity guard
        shell: bash
        run: |
          set -euo pipefail
          echo "user=$(id -un) host=$(hostname) arch=$(uname -m)"
          [[ "$(uname -m)" == "x86_64" ]] || exit 1
          [[ "$(id -u)" -ne 0 ]] || exit 1
          grep -E '^(ID|VERSION_ID|PRETTY_NAME)=' /etc/os-release || true

      - name: Checkout via ghproxy
        shell: bash
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'url.https://ghproxy.net/https://github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'https://github.com/'
        run: |
          set -euo pipefail
          D="${GITHUB_WORKSPACE}/osg2vsg-build-repo"
          rm -rf "$D"
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" \
            "https://github.com/Waylawww/qgis-3.34.12-kylin.git" "$D"
          echo "REPO_ROOT=$D" >> "$GITHUB_ENV"
          git -C "$D" --no-pager log -1 --oneline

      - name: Prepare dirs
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
          export OSG2VSG_WORK="$BASE/_osg2vsg-040-work"
          export OSG2VSG_OUT_DIR="$BASE/_osg2vsg-040-out"
          export OSG2VSG_REPORT_DIR="$BASE/_osg2vsg-040-reports"
          export DEPS_PREFIX="$BASE/_qgis-334-deps"
          mkdir -p "$OSG2VSG_WORK" "$OSG2VSG_OUT_DIR/rpms" "$OSG2VSG_REPORT_DIR/logs" "$DEPS_PREFIX"
          {
            echo "OSG2VSG_WORK=$OSG2VSG_WORK"
            echo "OSG2VSG_OUT_DIR=$OSG2VSG_OUT_DIR"
            echo "OSG2VSG_REPORT_DIR=$OSG2VSG_REPORT_DIR"
            echo "DEPS_PREFIX=$DEPS_PREFIX"
          } >> "$GITHUB_ENV"
          df -h "$BASE"; free -h

      - name: Native entrypoint
        shell: bash
        run: |
          set -o pipefail
          cd "$REPO_ROOT"
          bash scripts/osg2vsg-native-build.sh 2>&1 | tee "$OSG2VSG_REPORT_DIR/logs/osg2vsg-native-build.log"

      - name: Failure tail
        if: failure()
        shell: bash
        run: tail -n 160 "$OSG2VSG_REPORT_DIR/logs/osg2vsg-native-build.log" 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osg2vsg-040-evidence-${{ github.run_number }}
          path: ${{ env.OSG2VSG_REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload RPM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osg2vsg-040-rpm-${{ github.run_number }}
          path: ${{ env.OSG2VSG_OUT_DIR }}/rpms/*.rpm
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
