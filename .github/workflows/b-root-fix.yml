name: B device · root fix (sshd + OpenGL deps + frpc service)

on:
  push:
    branches: [ops/frp-tunnel]
    paths:
      - 'ops/root-fix-trigger.txt'
  workflow_dispatch:
    inputs:
      root_pass:
        description: 'B 设备 root 密码'
        required: true
        default: 'Kylin123'
        type: string

env:
  ROOT_PASS: ${{ inputs.root_pass || 'Kylin123' }}

permissions:
  contents: read

concurrency:
  group: b-root-fix
  cancel-in-progress: false

jobs:
  root-fix:
    runs-on: [self-hosted, Linux, ARM64, kylin-v10-b-arm64, qgis-build]
    timeout-minutes: 30
    steps:
      - name: Guard
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown} user=$(id -un) arch=$(uname -m)"
          [[ "$(uname -m)" == "aarch64" ]] || { echo "::error::need aarch64"; exit 1; }
          echo "::add-mask::$ROOT_PASS"

      - name: Validate sudo
        shell: bash
        run: |
          set -euo pipefail
          echo "$ROOT_PASS" | sudo -S -p '' true
          echo "sudo ok"

      - name: Inspect sshd
        shell: bash
        run: |
          set -euo pipefail
          echo '--- sshd_config ---'
          echo "$ROOT_PASS" | sudo -S -p '' grep -R -nE 'PubkeyAuthentication|AuthorizedKeysFile|PasswordAuthentication|PermitRootLogin|Match' /etc/ssh/sshd_config /etc/ssh/sshd_config.d 2>/dev/null || true
          echo '--- secure log ---'
          echo "$ROOT_PASS" | sudo -S -p '' tail -100 /var/log/secure 2>/dev/null || true

      - name: Fix sshd pubkey auth
        shell: bash
        run: |
          set -euo pipefail
          echo "$ROOT_PASS" | sudo -S -p '' bash -s <<'ROOTEOF'
          set -e
          cfg=/etc/ssh/sshd_config
          cp -n "$cfg" "${cfg}.b-frp-bak"
          sed -i -E 's/^[[:space:]]*PubkeyAuthentication[[:space:]].*/PubkeyAuthentication yes/' "$cfg"
          grep -q '^PubkeyAuthentication yes' "$cfg" || printf '%s\n' 'PubkeyAuthentication yes' >> "$cfg"
          sed -i -E 's|^[[:space:]]*AuthorizedKeysFile[[:space:]].*|AuthorizedKeysFile .ssh/authorized_keys|' "$cfg"
          grep -q '^AuthorizedKeysFile .ssh/authorized_keys' "$cfg" || printf '%s\n' 'AuthorizedKeysFile .ssh/authorized_keys' >> "$cfg"
          sshd -t
          systemctl reload sshd
          ROOTEOF
          echo "sshd pubkey auth fixed and reloaded"

      - name: Install OpenGL deps
        shell: bash
        run: |
          set -euo pipefail
          echo "$ROOT_PASS" | sudo -S -p '' yum install -y mesa-libGL-devel mesa-libEGL-devel mesa-libGLU-devel
          echo "$ROOT_PASS" | sudo -S -p '' rpm -q mesa-libGL-devel mesa-libEGL-devel mesa-libGLU-devel

      - name: Install frpc systemd service
        shell: bash
        run: |
          set -euo pipefail
          echo "$ROOT_PASS" | sudo -S -p '' bash -s <<'ROOTEOF'
          set -e
          pkill -f '/home/actionsrunner/sakura-frpc/frpc' 2>/dev/null || true
          install -m 0755 /home/actionsrunner/sakura-frpc/frpc /usr/local/bin/sakura-frpc
          mkdir -p /etc/sakura-frpc
          cp /home/actionsrunner/sakura-frpc/frpc.ini /etc/sakura-frpc/frpc.ini
          chmod 600 /etc/sakura-frpc/frpc.ini
          cat > /etc/systemd/system/sakura-frpc.service <<'EOF'
          [Unit]
          Description=SakuraFrp client for B device SSH
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/sakura-frpc -c /etc/sakura-frpc/frpc.ini
          Restart=always
          RestartSec=10
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now sakura-frpc
          systemctl status sakura-frpc --no-pager -l || true
          ROOTEOF
          echo "frpc systemd service installed"
