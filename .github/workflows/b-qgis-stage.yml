name: QGIS B ARM64 · staged runner build

on:
  push:
    branches: [ops/frp-tunnel]
    paths:
      - 'ops/qgis-stage-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qgis-b-arm64-staged-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: qgis
  SOURCE_BRANCH: feat/b-qgis-arm64
  QGIS_BUILD_JOBS: '6'
  FORCE_REBUILD_DEPS: 'false'
  FORCE_REBUILD_QT: 'false'

jobs:
  native-build:
    runs-on: [self-hosted, Linux, ARM64, kylin-v10-b-arm64, qgis-build]
    timeout-minutes: 720
    steps:
      - name: Runner identity guard
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "user=$(id -un) uid=$(id -u) groups=$(id -Gn)"
          echo "host=$(hostname) kernel=$(uname -r) arch=$(uname -m)"
          [[ "$(uname -m)" == "aarch64" ]] || { echo "::error::not aarch64"; exit 1; }
          [[ "$(id -u)" -ne 0 ]] || { echo "::error::refusing to build as root"; exit 1; }
          grep -E '^(ID|VERSION_ID|PRETTY_NAME)=' /etc/os-release || true
          echo "STAGE=${STAGE}"

      - name: Checkout source via ghproxy
        shell: bash
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'url.https://ghproxy.net/https://github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'https://github.com/'
        run: |
          set -euo pipefail
          D="${GITHUB_WORKSPACE}/qgis-b-arm64-repo"
          rm -rf "$D"
          for i in 1 2 3 4 5; do
            if git clone --depth=1 --branch "${SOURCE_BRANCH}" \
                 "https://github.com/Waylawww/qgis-3.34.12-kylin.git" "$D"; then break; fi
            echo "git clone failed ($i/5), retry..."
            rm -rf "$D"
            sleep $((i * 5))
          done
          [[ -d "$D/.git" ]] || { echo "FATAL: git clone failed after retries"; exit 1; }
          echo "REPO_ROOT=$D" >> "$GITHUB_ENV"
          git -C "$D" --no-pager log -1 --oneline

      - name: Prepare persistent dirs
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
          export DEPS_PREFIX="$BASE/_b-qgis-334-deps"
          export CACHE_DIR="$BASE/_b-qgis-334-cache"
          export WORK_DIR="$BASE/_b-qgis-334-work"
          export OUT_DIR="$BASE/_b-qgis-334-out"
          export REPORT_DIR="$BASE/_b-qgis-334-reports"
          export BUILD_ENV="$REPO_ROOT/config/build-b-arm64.env"
          mkdir -p "$DEPS_PREFIX" "$CACHE_DIR" "$WORK_DIR" \
                   "$OUT_DIR/rpms" "$OUT_DIR/srpms" \
                   "$REPORT_DIR/logs" "$REPORT_DIR/stages"
          {
            echo "BUILD_ENV=$BUILD_ENV"
            echo "QGIS_BUILD_BASE=$BASE"
            echo "DEPS_PREFIX=$DEPS_PREFIX"
            echo "CACHE_DIR=$CACHE_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "REPORT_DIR=$REPORT_DIR"
          } >> "$GITHUB_ENV"
          echo "toolchain: $(g++ --version | head -n1)"
          echo "cmake: $(cmake --version | head -n1)"
          df -h "$BASE"; free -h

      - name: Native build entrypoint
        shell: bash
        run: |
          set -o pipefail
          cd "$REPO_ROOT"
          bash scripts/native-build.sh 2>&1 | tee "$REPORT_DIR/logs/native-build.log"

      - name: Failure tail
        if: failure()
        shell: bash
        run: |
          tail -n 200 "$REPORT_DIR/logs/native-build.log" 2>/dev/null || true
          tail -n 120 "$REPORT_DIR/logs/00-preflight.log" 2>/dev/null || true
          tail -n 120 "$REPORT_DIR/logs/20-build-deps.log" 2>/dev/null || true
          tail -n 120 "$REPORT_DIR/logs/30-build-qgis.log" 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgis-b-arm64-evidence-${{ github.run_number }}-${{ env.STAGE }}
          path: |
            ${{ env.REPORT_DIR }}/
            ${{ env.REPO_ROOT }}/reports/
            ${{ env.REPO_ROOT }}/config/*.confirmed.env
          if-no-files-found: warn
          retention-days: 30

      - name: Upload RPM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgis-b-arm64-rpm-${{ github.run_number }}
          path: |
            ${{ env.OUT_DIR }}/rpms/*.rpm
            ${{ env.OUT_DIR }}/srpms/*.src.rpm
            ${{ env.OUT_DIR }}/*.sha256
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
