name: B device · frpc online (SakuraFrp / self-hosted runner)

on:
  push:
    branches: [ops/frp-tunnel]
    paths:
      - 'ops/frp-tunnel-trigger.txt'
  workflow_dispatch:
    inputs:
      frp_user:
        description: 'SakuraFrp 访问密钥'
        required: true
        default: '3mquuezbfy0wdbforb8h4efh0o5cvxd1'
        type: string
      frp_server_addr:
        description: 'server_addr'
        required: true
        default: 'frp-any.com'
        type: string
      frp_server_port:
        description: 'server_port'
        required: true
        default: '8088'
        type: string
      tunnel_name:
        description: '隧道段名'
        required: true
        default: 'win_ssh'
        type: string
      tunnel_id:
        description: '隧道 ID'
        required: true
        default: '29903960'
        type: string
      remote_port:
        description: '远程端口'
        required: true
        default: '55995'
        type: string
      frpc_url:
        description: 'frpc linux arm64 下载地址'
        required: true
        default: 'https://nya.globalslb.net/natfrp/client/frpc/0.51.0-sakura-15.1/frpc_linux_arm64'
        type: string
      ssh_user:
        description: 'B 设备 SSH 用户名'
        required: true
        default: 'actionsrunner'
        type: string

env:
  FRP_USER: ${{ inputs.frp_user || '3mquuezbfy0wdbforb8h4efh0o5cvxd1' }}
  FRP_SERVER_ADDR: ${{ inputs.frp_server_addr || 'frp-any.com' }}
  FRP_SERVER_PORT: ${{ inputs.frp_server_port || '8088' }}
  TUNNEL_NAME: ${{ inputs.tunnel_name || 'win_ssh' }}
  TUNNEL_ID: ${{ inputs.tunnel_id || '29903960' }}
  REMOTE_PORT: ${{ inputs.remote_port || '55995' }}
  FRPC_URL: ${{ inputs.frpc_url || 'https://nya.globalslb.net/natfrp/client/frpc/0.51.0-sakura-15.1/frpc_linux_arm64' }}
  SSH_USER: ${{ inputs.ssh_user || 'actionsrunner' }}

permissions:
  contents: read

concurrency:
  group: b-frpc-online
  cancel-in-progress: false

jobs:
  frpc-online:
    runs-on: [self-hosted, Linux, ARM64, kylin-v10-b-arm64, qgis-build]
    timeout-minutes: 20
    steps:
      - name: Guard
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown} user=$(id -un) arch=$(uname -m)"
          [[ "$(uname -m)" == "aarch64" ]] || { echo "::error::need aarch64 runner"; exit 1; }
          [[ "$(id -u)" -ne 0 ]] || { echo "::error::run as non-root runner user"; exit 1; }
          echo "::add-mask::${{ env.FRP_USER }}"

      - name: Authorize SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          KEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN68OKw46cKvAOloJUkApG9VfGRF8CcYBSfOlJpS1ud1 qgis-b-frp'
          grep -qF "$KEY" "$HOME/.ssh/authorized_keys" 2>/dev/null || echo "$KEY" >> "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"
          echo "SSH public key authorized for $(id -un)"

      - name: SSH diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          ls -ld "$HOME" "$HOME/.ssh" "$HOME/.ssh/authorized_keys" || true
          cat "$HOME/.ssh/authorized_keys" || true
          getent passwd "$(id -un)" || true
          grep -E '^[[:space:]]*(PubkeyAuthentication|AuthorizedKeysFile|PasswordAuthentication|PermitRootLogin)' /etc/ssh/sshd_config 2>/dev/null || true
          systemctl status sshd --no-pager -l 2>/dev/null | head -30 || true

      - name: Download SakuraFrp frpc arm64
        shell: bash
        env:
          FRPC_URL: ${{ env.FRPC_URL }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/sakura-frpc"
          rm -rf "$D"
          mkdir -p "$D"
          ok=0
          for u in "$FRPC_URL" "https://ghproxy.net/$FRPC_URL"; do
            if curl -fsSL --retry 4 --connect-timeout 20 "$u" -o "$D/frpc"; then ok=1; break; fi
          done
          [[ $ok -eq 1 ]] || { echo "::error::download frpc failed"; exit 1; }
          chmod +x "$D/frpc"
          file "$D/frpc" || true
          echo "FRPC_SRC=$D/frpc" >> "$GITHUB_ENV"

      - name: Configure frpc
        shell: bash
        env:
          FRP_USER: ${{ env.FRP_USER }}
          SERVER_ADDR: ${{ env.FRP_SERVER_ADDR }}
          SERVER_PORT: ${{ env.FRP_SERVER_PORT }}
          TUNNEL_NAME: ${{ env.TUNNEL_NAME }}
          TUNNEL_ID: ${{ env.TUNNEL_ID }}
          REMOTE_PORT: ${{ env.REMOTE_PORT }}
        run: |
          set -euo pipefail
          INSTALL_DIR="$HOME/sakura-frpc"
          mkdir -p "$INSTALL_DIR"
          cp "$FRPC_SRC" "$INSTALL_DIR/frpc"
          chmod +x "$INSTALL_DIR/frpc"
          cat > "$INSTALL_DIR/frpc.ini" <<EOF
          [common]
          user = $FRP_USER

          sakura_mode = true
          login_fail_exit = false

          server_addr = $SERVER_ADDR
          server_port = $SERVER_PORT

          [$TUNNEL_NAME]
          # id = $TUNNEL_ID
          type = tcp
          local_ip = 127.0.0.1
          local_port = 22
          remote_port = $REMOTE_PORT
          EOF
          chmod 600 "$INSTALL_DIR/frpc.ini"
          echo "FRP_INSTALL_DIR=$INSTALL_DIR" >> "$GITHUB_ENV"
          echo "配置已写入 $INSTALL_DIR/frpc.ini（访问密钥已 mask）"

      - name: Start frpc persistently
        shell: bash
        env:
          REMOTE_PORT: ${{ env.REMOTE_PORT }}
          SSH_USER: ${{ env.SSH_USER }}
          SERVER_ADDR: ${{ env.FRP_SERVER_ADDR }}
        run: |
          set -euo pipefail
          cd "$FRP_INSTALL_DIR"
          if sudo -n true 2>/dev/null; then
            echo "Using systemd (passwordless sudo available)"
            sudo install -m 0755 frpc /usr/local/bin/sakura-frpc
            sudo mkdir -p /etc/sakura-frpc
            sudo cp frpc.ini /etc/sakura-frpc/frpc.ini
            sudo chmod 600 /etc/sakura-frpc/frpc.ini
            sudo tee /etc/systemd/system/sakura-frpc.service >/dev/null <<'EOF'
          [Unit]
          Description=SakuraFrp client for B device SSH
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/sakura-frpc -c /etc/sakura-frpc/frpc.ini
          Restart=always
          RestartSec=10
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
          EOF
            sudo systemctl daemon-reload
            sudo systemctl enable --now sakura-frpc
            sleep 5
            sudo systemctl status sakura-frpc --no-pager -l || true
          else
            echo "No passwordless sudo; starting detached process"
            pkill -f "$FRP_INSTALL_DIR/frpc" 2>/dev/null || true
            setsid nohup "$FRP_INSTALL_DIR/frpc" -c "$FRP_INSTALL_DIR/frpc.ini" > "$FRP_INSTALL_DIR/frpc.log" 2>&1 < /dev/null &
            echo $! > "$FRP_INSTALL_DIR/frpc.pid"
            sleep 5
            cat "$FRP_INSTALL_DIR/frpc.log" || true
          fi
          echo "SSH target: ssh -i ~/.ssh/qgis_b_frp_ed25519 -p $REMOTE_PORT $SSH_USER@$SERVER_ADDR"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakura-frpc-b-log
          path: ${{ env.FRP_INSTALL_DIR }}/frpc.log
          if-no-files-found: ignore
