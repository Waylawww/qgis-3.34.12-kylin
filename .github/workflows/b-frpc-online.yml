name: B device · frpc online (self-hosted runner)

on:
  workflow_dispatch:
    inputs:
      frp_server_addr:
        description: 'FRP 服务端地址（frpc 连接用，不是面板地址）'
        required: true
        type: string
      frp_server_port:
        description: 'FRP 服务端端口'
        required: true
        default: '7000'
        type: string
      frp_auth_user:
        description: 'frpc auth.user'
        required: false
        default: 'wxy_1031'
        type: string
      frp_auth_token:
        description: 'frpc auth.token（不是面板密码；从 FRP 面板/服务商获取）'
        required: true
        type: string
      ssh_remote_port:
        description: '映射到 B 设备 22 端口的远程端口'
        required: true
        default: '60022'
        type: string
      ssh_user:
        description: 'B 设备 SSH 用户名'
        required: true
        default: 'actionsrunner'
        type: string
      frp_version:
        description: 'frp 版本（需与服务端兼容）'
        required: true
        default: '0.60.0'
        type: string

permissions:
  contents: read

concurrency:
  group: b-frpc-online
  cancel-in-progress: false

jobs:
  frpc-online:
    runs-on: [self-hosted, Linux, ARM64, kylin-v10-b-arm64, qgis-build]
    timeout-minutes: 20
    steps:
      - name: Guard
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown} user=$(id -un) arch=$(uname -m)"
          [[ "$(uname -m)" == "aarch64" ]] || { echo "::error::need aarch64 runner"; exit 1; }
          [[ "$(id -u)" -ne 0 ]] || { echo "::error::run as non-root runner user"; exit 1; }
          echo "::add-mask::${{ inputs.frp_auth_token }}"

      - name: Download frp arm64
        shell: bash
        env:
          FRP_VERSION: ${{ inputs.frp_version }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/frp-$FRP_VERSION"
          rm -rf "$D"
          mkdir -p "$D"
          base="https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_arm64.tar.gz"
          ok=0
          for u in "$base" "https://ghproxy.net/$base"; do
            if curl -fsSL --retry 4 --connect-timeout 20 "$u" -o "$D/frp.tgz"; then ok=1; break; fi
          done
          [[ $ok -eq 1 ]] || { echo "::error::download frp failed"; exit 1; }
          tar -xzf "$D/frp.tgz" -C "$D"
          src="$D/frp_${FRP_VERSION}_linux_arm64"
          [[ -x "$src/frpc" ]] || { echo "::error::frpc not found"; find "$D" -maxdepth 2 -type f | head -50; exit 1; }
          echo "FRPC_SRC=$src/frpc" >> "$GITHUB_ENV"

      - name: Configure frpc
        shell: bash
        env:
          SERVER_ADDR: ${{ inputs.frp_server_addr }}
          SERVER_PORT: ${{ inputs.frp_server_port }}
          AUTH_USER: ${{ inputs.frp_auth_user }}
          AUTH_TOKEN: ${{ inputs.frp_auth_token }}
          REMOTE_PORT: ${{ inputs.ssh_remote_port }}
        run: |
          set -euo pipefail
          INSTALL_DIR="$HOME/frp-b"
          mkdir -p "$INSTALL_DIR"
          cp "$FRPC_SRC" "$INSTALL_DIR/frpc"
          chmod +x "$INSTALL_DIR/frpc"
          cat > "$INSTALL_DIR/frpc.ini" <<EOF
          [common]
          server_addr = $SERVER_ADDR
          server_port = $SERVER_PORT
          auth.method = token
          auth.user = $AUTH_USER
          auth.token = $AUTH_TOKEN

          [qgis-b-ssh]
          type = tcp
          local_ip = 127.0.0.1
          local_port = 22
          remote_port = $REMOTE_PORT
          EOF
          chmod 600 "$INSTALL_DIR/frpc.ini"
          echo "FRP_INSTALL_DIR=$INSTALL_DIR" >> "$GITHUB_ENV"
          echo "配置已写入 $INSTALL_DIR/frpc.ini（token 已 mask）"

      - name: Start frpc persistently
        shell: bash
        env:
          REMOTE_PORT: ${{ inputs.ssh_remote_port }}
          SSH_USER: ${{ inputs.ssh_user }}
          SERVER_ADDR: ${{ inputs.frp_server_addr }}
        run: |
          set -euo pipefail
          cd "$FRP_INSTALL_DIR"
          if sudo -n true 2>/dev/null; then
            echo "Using systemd (passwordless sudo available)"
            sudo install -m 0755 frpc /usr/local/bin/frpc-b
            sudo mkdir -p /etc/frp-b
            sudo cp frpc.ini /etc/frp-b/frpc.ini
            sudo chmod 600 /etc/frp-b/frpc.ini
            sudo tee /etc/systemd/system/frpc-b.service >/dev/null <<'EOF'
          [Unit]
          Description=frp client for B device SSH
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/frpc-b -c /etc/frp-b/frpc.ini
          Restart=always
          RestartSec=10
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
          EOF
            sudo systemctl daemon-reload
            sudo systemctl enable --now frpc-b
            sleep 5
            sudo systemctl status frpc-b --no-pager -l || true
          else
            echo "No passwordless sudo; starting detached process (may stop when job ends)"
            pkill -f "$FRP_INSTALL_DIR/frpc" 2>/dev/null || true
            setsid nohup "$FRP_INSTALL_DIR/frpc" -c "$FRP_INSTALL_DIR/frpc.ini" > "$FRP_INSTALL_DIR/frpc.log" 2>&1 < /dev/null &
            echo $! > "$FRP_INSTALL_DIR/frpc.pid"
            sleep 5
            cat "$FRP_INSTALL_DIR/frpc.log" || true
          fi
          echo "SSH target: ssh -i ~/.ssh/qgis_b_frp_ed25519 -p $REMOTE_PORT $SSH_USER@$SERVER_ADDR"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frpc-b-log
          path: ${{ env.FRP_INSTALL_DIR }}/frpc.log
          if-no-files-found: ignore