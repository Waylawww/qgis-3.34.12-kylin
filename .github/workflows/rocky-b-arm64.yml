name: rocky 1.0.2 · Native Kylin V10 aarch64 RPM (B device)

# 与 QGIS/glslang/assimp/osg2vsg B 设备共用同一台 self-hosted runner。
# 源码 = 官方固定 commit（rocky + Vulkan-Headers + 5 个轻量依赖），与 A 设备一致。
# 依赖链：vsg 1.1.13（osg2vsg B 构建）+ glslang 16.1.0（B 构建）+ GDAL（QGIS deps）。
on:
  push:
    branches: [feat/b-rocky-arm64]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      stage:
        description: 'preflight / source / build / install / all'
        type: choice
        options: [preflight, source, build, install, all]
        default: all
      build_jobs:
        description: '并行编译任务数'
        default: '6'

permissions:
  contents: read

concurrency:
  group: rocky-native-b-arm64-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event.inputs.stage || 'all' }}
  ROCKY_BUILD_JOBS: ${{ github.event.inputs.build_jobs || '6' }}

jobs:
  native-build:
    name: Native rocky build on Kylin V10 aarch64 B device
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: [self-hosted, Linux, ARM64, kylin-v10-b-arm64, qgis-build]
    timeout-minutes: 480
    steps:
      - name: Runner identity guard
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "user=$(id -un) uid=$(id -u) groups=$(id -Gn)"
          echo "host=$(hostname) kernel=$(uname -r) arch=$(uname -m)"
          [[ "$(uname -m)" == "aarch64" ]] || { echo "::error::not aarch64"; exit 1; }
          [[ "$(id -u)" -ne 0 ]] || { echo "::error::refusing to build as root"; exit 1; }
          grep -E '^(ID|VERSION_ID|PRETTY_NAME)=' /etc/os-release || true

      - name: Checkout trusted branch via ghproxy
        shell: bash
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'url.https://ghproxy.net/https://github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'https://github.com/'
        run: |
          set -euo pipefail
          D="${GITHUB_WORKSPACE}/rocky-b-arm64-repo"
          rm -rf "$D"
          for i in 1 2 3 4 5; do
            if git clone --depth=1 --branch "${GITHUB_REF_NAME}" \
                 "https://github.com/Waylawww/qgis-3.34.12-kylin.git" "$D"; then break; fi
            echo "git clone failed ($i/5), retry..."
            rm -rf "$D"; sleep $((i * 5))
          done
          [[ -d "$D/.git" ]] || { echo "FATAL: git clone failed after retries"; exit 1; }
          echo "REPO_ROOT=$D" >> "$GITHUB_ENV"
          git -C "$D" --no-pager log -1 --oneline

      - name: Probe cmake >= 3.21
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
          CMAKE_BIN="$(command -v cmake)"
          if ! "$CMAKE_BIN" --version | head -n1 | grep -Eq '3\.(2[1-9]|[3-9][0-9])'; then
            for c in "$BASE/_b-qgis-334-deps/bin/cmake" \
                     "$BASE"/_b-glslang-1610-work/tools/cmake-*/bin/cmake \
                     "$BASE"/_b-assimp-605-deps/bin/cmake; do
              [[ -x "$c" ]] || continue
              if "$c" --version 2>/dev/null | head -n1 | grep -Eq '3\.(2[1-9]|[3-9][0-9])'; then
                CMAKE_BIN="$c"; break
              fi
            done
          fi
          echo "CMAKE_BIN=$CMAKE_BIN" >> "$GITHUB_ENV"
          echo "using cmake: $($CMAKE_BIN --version | head -n1)"

      - name: Prepare persistent directories
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
          export ROCKY_WORK="$BASE/_b-rocky-102-work"
          export ROCKY_OUT_DIR="$BASE/_b-rocky-102-out"
          export ROCKY_REPORT_DIR="$BASE/_b-rocky-102-reports"
          export DEPS_PREFIX="$BASE/_b-qgis-334-deps"
          export CACHE_DIR="$BASE/_b-qgis-334-cache"
          export BUILD_ENV="$REPO_ROOT/config/rocky-b-arm64.env"
          mkdir -p "$ROCKY_WORK" "$ROCKY_OUT_DIR/rpms" "$ROCKY_REPORT_DIR/logs" \
                   "$DEPS_PREFIX" "$CACHE_DIR"
          {
            echo "BUILD_ENV=$BUILD_ENV"
            echo "ROCKY_WORK=$ROCKY_WORK"
            echo "ROCKY_OUT_DIR=$ROCKY_OUT_DIR"
            echo "ROCKY_REPORT_DIR=$ROCKY_REPORT_DIR"
            echo "DEPS_PREFIX=$DEPS_PREFIX"
            echo "CACHE_DIR=$CACHE_DIR"
          } >> "$GITHUB_ENV"
          echo "toolchain: $(g++ --version | head -n1)"
          df -h "$BASE"; free -h

      - name: Environment probe (GCC filesystem capability)
        shell: bash
        run: |
          set +e
          echo "=== g++ ==="; g++ --version | head -n1
          echo "=== <filesystem> syntax ==="
          printf '#include <filesystem>\nint main(){}\n' | g++ -std=c++17 -x c++ - -fsyntax-only 2>&1 | head -3
          echo "=== <experimental/filesystem> syntax ==="
          printf '#include <experimental/filesystem>\nint main(){}\n' | g++ -std=c++17 -x c++ - -fsyntax-only 2>&1 | head -3
          echo "=== find libstdc++fs ==="
          find /usr /opt -name 'libstdc++fs*' 2>/dev/null | head -20
          echo "=== link -lstdc++fs ==="
          printf 'int main(){}\n' > /tmp/fsprobe.cpp
          g++ -x c++ /tmp/fsprobe.cpp -lstdc++fs -o /tmp/fsprobe 2>&1 | head -5
          echo "=== experimental filesystem link+run ==="
          cat > /tmp/fstest.cpp <<'EOF'
#include <experimental/filesystem>
int main(){ auto p = std::experimental::filesystem::current_path(); return p.empty(); }
EOF
          g++ -std=c++17 /tmp/fstest.cpp -o /tmp/fstest -lstdc++fs 2>&1 | head -8
          [[ -x /tmp/fstest ]] && { /tmp/fstest; echo "EXPERIMENTAL_FS_RUNTIME_RC=$?"; }
          echo "=== compilers/rpms ==="
          ls -1 /usr/bin/g++* 2>/dev/null; ls -1 /opt/rh/*/root/usr/bin/g++* 2>/dev/null
          rpm -qa | grep -iE '^(gcc|libstdc\+\+|cpp)' | sort
          echo "=== done probe ==="

      - name: Native build / install / test entrypoint
        shell: bash
        run: |
          set -o pipefail
          cd "$REPO_ROOT"
          ROCKY_CMAKE="$CMAKE_BIN" bash scripts/rocky-native-build.sh 2>&1 | tee "$ROCKY_REPORT_DIR/logs/rocky-native-build.log"

      - name: Failure tail (fast triage)
        if: failure()
        shell: bash
        run: |
          echo '===== rocky-native-build.log tail ====='
          tail -n 200 "$ROCKY_REPORT_DIR/logs/rocky-native-build.log" 2>/dev/null || true
          echo '===== rocky cmake config tail ====='
          tail -n 120 "$ROCKY_REPORT_DIR/logs/rocky-cmake-config.log" 2>/dev/null || true
          echo '===== rocky build log tail ====='
          tail -n 120 "$ROCKY_REPORT_DIR/logs/rocky-build.log" 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocky-b-arm64-evidence-${{ github.run_number }}-${{ github.event.inputs.stage || 'all' }}
          path: ${{ env.ROCKY_REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload RPM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocky-b-arm64-rpm-${{ github.run_number }}
          path: ${{ env.ROCKY_OUT_DIR }}/rpms/*.rpm
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
