name: QGIS 3.34.12 · Native Kylin V10 RPM

on:
  push:
    branches:
      - feat/native-kylin-self-hosted-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qgis-native-kylin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-build:
    name: Native build on target Kylin/Hygon runner
    runs-on: self-hosted
    timeout-minutes: 360
    env:
      QGIS_BUILD_JOBS: '4'
      REPO_ROOT: ${{ github.workspace }}
      WORK_DIR: ${{ runner.temp }}/qgis-33412-work
      OUT_DIR: ${{ runner.temp }}/qgis-33412-out
      REPORT_DIR: ${{ runner.temp }}/qgis-33412-reports
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Native dependency probe and build
        shell: bash
        run: bash scripts/native-build.sh

      - name: Upload RPMs, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgis-3.34.12-kylin-native-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/qgis-33412-out/
            ${{ runner.temp }}/qgis-33412-reports/
            ${{ github.workspace }}/reports/
            ${{ github.workspace }}/config/*.confirmed.env
            ${{ github.workspace }}/packaging/generated/
            ${{ github.workspace }}/packaging/qgis-kylin.spec
          if-no-files-found: warn
          compression-level: 0
