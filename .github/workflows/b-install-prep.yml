name: B device · prepare restricted RPM installer

on:
  push:
    branches: [ops/frp-tunnel]
    paths:
      - 'ops/install-prep-trigger.txt'
  workflow_dispatch:
    inputs:
      root_pass:
        description: 'B 设备 root 密码'
        required: true
        default: 'Kylin123'
        type: string

env:
  ROOT_PASS: ${{ inputs.root_pass || 'Kylin123' }}
  RPM: /opt/actions-runner/_work/qgis-3.34.12-kylin/_b-qgis-334-out/rpms/qgis-3.34.12-1.ky10.aarch64.rpm

permissions:
  contents: read

concurrency:
  group: b-install-prep
  cancel-in-progress: false

jobs:
  prep:
    runs-on: [self-hosted, Linux, ARM64, kylin-v10-b-arm64, qgis-build]
    timeout-minutes: 20
    steps:
      - name: Guard
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown} user=$(id -un) arch=$(uname -m)"
          [[ "$(uname -m)" == "aarch64" ]] || { echo "::error::need aarch64"; exit 1; }
          [[ -f "$RPM" ]] || { echo "::error::RPM not found: $RPM"; exit 1; }
          echo "::add-mask::$ROOT_PASS"

      - name: Prepare installer as root
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/frp-install-prep.sh <<'SCRIPT'
          set -e
          RPM=/opt/actions-runner/_work/qgis-3.34.12-kylin/_b-qgis-334-out/rpms/qgis-3.34.12-1.ky10.aarch64.rpm
          mkdir -p /etc/qgis-ci
          sha256sum "$RPM" > /etc/qgis-ci/allowed-rpm.sha256
          chmod 600 /etc/qgis-ci/allowed-rpm.sha256
          cat > /usr/local/sbin/qgis-ci-install <<'EOF'
          #!/bin/bash
          set -Eeuo pipefail
          RPM=/opt/actions-runner/_work/qgis-3.34.12-kylin/_b-qgis-334-out/rpms/qgis-3.34.12-1.ky10.aarch64.rpm
          ALLOW=/etc/qgis-ci/allowed-rpm.sha256
          sha256sum -c "$ALLOW" >/dev/null
          rpm -e --nodeps qgis 2>/dev/null || true
          rpm -ivh --replacefiles --replacepkgs "$RPM"
          EOF
          chown root:root /usr/local/sbin/qgis-ci-install
          chmod 700 /usr/local/sbin/qgis-ci-install
          echo 'actionsrunner ALL=(root) NOPASSWD: /usr/local/sbin/qgis-ci-install' > /etc/sudoers.d/qgis-ci-install
          chown root:root /etc/sudoers.d/qgis-ci-install
          chmod 440 /etc/sudoers.d/qgis-ci-install
          visudo -c -f /etc/sudoers.d/qgis-ci-install
          echo '--- allowed sha256 ---'
          cat /etc/qgis-ci/allowed-rpm.sha256
          SCRIPT
          chmod 644 /tmp/frp-install-prep.sh
          printf '%s\n' "$ROOT_PASS" | su - root -c 'bash /tmp/frp-install-prep.sh'

      - name: Verify runner can call installer
        shell: bash
        run: |
          set -euo pipefail
          sudo -n -l /usr/local/sbin/qgis-ci-install
          grep -q -- '--replacefiles' /usr/local/sbin/qgis-ci-install
          echo "installer ready"
