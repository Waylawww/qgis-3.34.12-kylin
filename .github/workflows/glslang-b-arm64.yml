name: glslang 16.1.0 · Native Kylin V10 aarch64 RPM (B device)

# 与 QGIS / Assimp B 设备共用同一台 self-hosted runner（麒麟 V10 / aarch64）。
# 源码 = glslang main-tot 固定 commit + known_good External commit（等价于附件 libs/glslang-10.19）。
# 不接受 pull_request；push 仅允许本分支。
on:
  push:
    branches: [feat/b-glslang-arm64]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      stage:
        description: '执行阶段：preflight / source / build / install / all'
        type: choice
        options: [preflight, source, build, install, all]
        default: all
      build_jobs:
        description: '并行编译任务数'
        default: '6'

permissions:
  contents: read

concurrency:
  group: glslang-native-b-arm64-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event.inputs.stage || 'all' }}
  GLSLANG_BUILD_JOBS: ${{ github.event.inputs.build_jobs || '6' }}

jobs:
  native-build:
    name: Native glslang build on Kylin V10 aarch64 B device
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: [self-hosted, Linux, ARM64, kylin-v10-b-arm64, qgis-build]
    timeout-minutes: 480
    steps:
      - name: Runner identity guard
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "user=$(id -un) uid=$(id -u) groups=$(id -Gn)"
          echo "host=$(hostname) kernel=$(uname -r) arch=$(uname -m)"
          [[ "$(uname -m)" == "aarch64" ]] || { echo "::error::not aarch64"; exit 1; }
          [[ "$(id -u)" -ne 0 ]] || { echo "::error::refusing to build as root"; exit 1; }
          grep -E '^(ID|VERSION_ID|PRETTY_NAME)=' /etc/os-release || true

      # runner 直连 github.com 超时，使用 ghproxy 反向代理克隆 trusted 分支。
      - name: Checkout trusted branch via ghproxy
        shell: bash
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'url.https://ghproxy.net/https://github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'https://github.com/'
        run: |
          set -euo pipefail
          D="${GITHUB_WORKSPACE}/glslang-b-arm64-repo"
          rm -rf "$D"
          for i in 1 2 3 4 5; do
            if git clone --depth=1 --branch "${GITHUB_REF_NAME}" \
                 "https://github.com/Waylawww/qgis-3.34.12-kylin.git" "$D"; then break; fi
            echo "git clone failed ($i/5), retry..."
            rm -rf "$D"
            sleep $((i * 5))
          done
          [[ -d "$D/.git" ]] || { echo "FATAL: git clone failed after retries"; exit 1; }
          echo "REPO_ROOT=$D" >> "$GITHUB_ENV"
          git -C "$D" --no-pager log -1 --oneline

      - name: Prepare persistent directories
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
          export GLSLANG_WORK="$BASE/_b-glslang-1610-work"
          export GLSLANG_OUT_DIR="$BASE/_b-glslang-1610-out"
          export GLSLANG_REPORT_DIR="$BASE/_b-glslang-1610-reports"
          # 复用 B 设备 QGIS/Assimp 已准备好的依赖前缀（cmake/ninja）
          export DEPS_PREFIX="$BASE/_b-qgis-334-deps"
          export CACHE_DIR="$BASE/_b-qgis-334-cache"
          export BUILD_ENV="$REPO_ROOT/config/glslang-b-arm64.env"
          mkdir -p "$GLSLANG_WORK" "$GLSLANG_OUT_DIR/rpms" \
                   "$GLSLANG_REPORT_DIR/logs" "$DEPS_PREFIX" "$CACHE_DIR"
          {
            echo "BUILD_ENV=$BUILD_ENV"
            echo "GLSLANG_BUILD_BASE=$BASE"
            echo "GLSLANG_WORK=$GLSLANG_WORK"
            echo "GLSLANG_OUT_DIR=$GLSLANG_OUT_DIR"
            echo "GLSLANG_REPORT_DIR=$GLSLANG_REPORT_DIR"
            echo "DEPS_PREFIX=$DEPS_PREFIX"
            echo "CACHE_DIR=$CACHE_DIR"
          } >> "$GITHUB_ENV"
          echo "toolchain: $(g++ --version | head -n1)"
          echo "cmake: $("${DEPS_PREFIX}/bin/cmake" --version 2>/dev/null | head -n1 || cmake --version | head -n1)"
          df -h "$BASE"; free -h

      - name: Native build / install / test entrypoint
        shell: bash
        run: |
          set -o pipefail
          cd "$REPO_ROOT"
          bash scripts/glslang-native-build.sh 2>&1 | tee "$GLSLANG_REPORT_DIR/logs/glslang-native-build.log"

      - name: Failure tail (fast triage)
        if: failure()
        shell: bash
        run: |
          echo '===== glslang-native-build.log tail ====='
          tail -n 180 "$GLSLANG_REPORT_DIR/logs/glslang-native-build.log" 2>/dev/null || true
          echo '===== ctest tail ====='
          tail -n 100 "$GLSLANG_REPORT_DIR/logs/glslang-ctest.log" 2>/dev/null || true
          echo '===== cmake config tail ====='
          tail -n 80 "$GLSLANG_REPORT_DIR/logs/glslang-cmake-config.log" 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glslang-b-arm64-evidence-${{ github.run_number }}-${{ github.event.inputs.stage || 'all' }}
          path: ${{ env.GLSLANG_REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload RPM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glslang-b-arm64-rpm-${{ github.run_number }}
          path: ${{ env.GLSLANG_OUT_DIR }}/rpms/*.rpm
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
