name: B device GCC filesystem capability probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, kylin-v10-b-arm64, qgis-build]
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: bash
        run: |
          echo "=== g++ ==="; g++ --version | head -n1
          echo "=== <filesystem> syntax ==="
          printf '#include <filesystem>\nint main(){}\n' | g++ -std=c++17 -x c++ - -fsyntax-only 2>&1 | head -5 || true
          echo "=== <experimental/filesystem> syntax ==="
          printf '#include <experimental/filesystem>\nint main(){}\n' | g++ -std=c++17 -x c++ - -fsyntax-only 2>&1 | head -5 || true
          echo "=== find libstdc++fs ==="
          find /usr /opt -name 'libstdc++fs*' 2>/dev/null | head -20
          echo "=== link -lstdc++fs (empty main) ==="
          printf 'int main(){}\n' > /tmp/fsprobe.cpp
          g++ -x c++ /tmp/fsprobe.cpp -lstdc++fs -o /tmp/fsprobe 2>&1 | head -5 || true
          echo "=== link experimental filesystem API ==="
          cat > /tmp/fstest.cpp <<'EOF'
#include <experimental/filesystem>
int main(){ auto p = std::experimental::filesystem::current_path(); return p.empty(); }
EOF
          g++ -std=c++17 /tmp/fstest.cpp -o /tmp/fstest -lstdc++fs 2>&1 | head -10 || true
          if [[ -x /tmp/fstest ]]; then /tmp/fstest && echo "EXPERIMENTAL_FS_RUNTIME_OK"; fi
          echo "=== available compilers ==="
          ls -1 /usr/bin/g++* /usr/bin/gcc* 2>/dev/null || true
          ls -1 /opt/rh/*/root/usr/bin/g++* 2>/dev/null || true
          echo "=== gcc/libstdc++ rpms ==="
          rpm -qa | grep -iE '^(gcc|libstdc\+\+|cpp)' | sort
          echo "=== SCL toolsets ==="
          ls -1 /opt/rh 2>/dev/null || true
